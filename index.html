<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵珠 / 魔丸人格测评中心（Vue版）</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
      :root {
        --bg: #f6f8fc;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #4f46e5;
        --primary-soft: #e0e7ff;
        --ok: #0f766e;
        --hot: #b45309;
        --line: #e5e7eb;
        --shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top right, #e0e7ff, #f7f9fd 35%, #f4f7fb 100%);
      }
      .wrap {
        max-width: 1100px;
        margin: 28px auto 56px;
        padding: 0 16px;
        display: grid;
        grid-template-columns: 1fr 280px;
        gap: 16px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid #eef2f7;
        border-radius: 18px;
        box-shadow: var(--shadow);
      }
      .hero { padding: 24px; }
      .hero h1 { margin: 0; font-size: 30px; }
      .hero p { margin: 8px 0 0; color: var(--muted); }
      .notice {
        margin-top: 14px;
        padding: 12px 14px;
        border-left: 4px solid var(--primary);
        border-radius: 10px;
        background: #f5f7ff;
        font-size: 14px;
      }
      .quiz { padding: 20px; margin-top: 14px; }
      .section-title { margin: 0 0 14px; }
      .q {
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .q-title { margin: 0 0 10px; font-weight: 700; }
      .opts { display: grid; grid-template-columns: repeat(auto-fit,minmax(145px,1fr)); gap: 8px; }
      .opt {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        cursor: pointer;
        font-size: 14px;
      }
      .opt input { margin-right: 6px; }
      .actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
      button {
        border: none;
        border-radius: 10px;
        padding: 11px 16px;
        font-weight: 700;
        cursor: pointer;
      }
      .primary { background: var(--primary); color: #fff; }
      .ghost { background: #eef2ff; color: #312e81; }
      .report {
        margin-top: 16px;
        border-top: 1px dashed var(--line);
        padding-top: 16px;
      }
      .badge {
        display: inline-block;
        border-radius: 999px;
        padding: 5px 12px;
        font-size: 13px;
        font-weight: 800;
      }
      .lingzhu { background: #dcfce7; color: var(--ok); }
      .mowan { background: #ffedd5; color: var(--hot); }
      .balanced { background: var(--primary-soft); color: #3730a3; }
      .metrics {
        margin-top: 12px;
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
        gap: 10px;
      }
      .metric { border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
      .bar { margin-top: 6px; height: 8px; border-radius: 999px; background: #eef2ff; overflow: hidden; }
      .fill { height: 100%; background: var(--primary); }
      .side { padding: 16px; }
      .ad-card {
        background: linear-gradient(140deg, #312e81, #4f46e5 65%, #7c3aed);
        color: #fff;
        border-radius: 14px;
        padding: 14px;
        margin-bottom: 12px;
      }
      .ad-tag { font-size: 12px; opacity: .85; }
      .ad-btn {
        margin-top: 10px;
        display: inline-block;
        text-decoration: none;
        color: #111827;
        background: #fff;
        border-radius: 999px;
        padding: 6px 12px;
        font-weight: 700;
        font-size: 12px;
      }
      .sticky { position: sticky; top: 16px; }
      .modal {
        position: fixed; inset: 0;
        background: rgba(15, 23, 42, 0.45);
        display: flex; align-items: center; justify-content: center;
        padding: 12px;
      }
      .modal-card {
        width: min(520px, 100%);
        background: #fff;
        border-radius: 16px;
        padding: 18px;
      }
      @media (max-width: 920px) {
        .wrap { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <script>
      const { createApp, computed, ref } = Vue;

      createApp({
        setup() {
          const showAdModal = ref(true);
          const submitted = ref(false);

          const scale = [
            { value: 1, text: '非常不同意' },
            { value: 2, text: '不同意' },
            { value: 3, text: '中立' },
            { value: 4, text: '同意' },
            { value: 5, text: '非常同意' }
          ];

          const questions = ref([
            { id: 1, dim: 'empathy', dir: 'ling', text: '我在冲突中会优先理解他人情绪，再推进问题解决。', answer: null },
            { id: 2, dim: 'empathy', dir: 'ling', text: '做决定时，我会考虑决定对关系长期稳定性的影响。', answer: null },
            { id: 3, dim: 'empathy', dir: 'mo', text: '如果目标清晰，我可以先推进结果，关系修复可以后置。', answer: null },
            { id: 4, dim: 'control', dir: 'ling', text: '我习惯按计划推进，并在关键节点复盘风险。', answer: null },
            { id: 5, dim: 'control', dir: 'mo', text: '面对不确定性时，我更相信临场反应而非既定流程。', answer: null },
            { id: 6, dim: 'control', dir: 'ling', text: '即使很急，我也会先确保行为不越过底线规则。', answer: null },
            { id: 7, dim: 'drive', dir: 'mo', text: '遇到阻碍时，我通常会提高强度而不是降低目标。', answer: null },
            { id: 8, dim: 'drive', dir: 'mo', text: '我愿意承担争议，只要结果能带来突破。', answer: null },
            { id: 9, dim: 'drive', dir: 'ling', text: '我更看重可持续成功，而非短期爆发式胜利。', answer: null },
            { id: 10, dim: 'identity', dir: 'mo', text: '即使多数人反对，我也会坚持自己认为正确的方向。', answer: null },
            { id: 11, dim: 'identity', dir: 'ling', text: '我认同“在系统中协作”比“单点英雄主义”更重要。', answer: null },
            { id: 12, dim: 'identity', dir: 'mo', text: '我喜欢通过打破旧框架来证明自己的价值。', answer: null }
          ]);

          const answeredCount = computed(() => questions.value.filter(q => q.answer !== null).length);
          const allDone = computed(() => answeredCount.value === questions.value.length);

          const scores = computed(() => {
            let ling = 0;
            let mo = 0;
            const dim = { empathy: 0, control: 0, drive: 0, identity: 0 };

            questions.value.forEach(q => {
              if (q.answer === null) return;
              const v = q.answer;
              const lingAdd = q.dir === 'ling' ? v : 6 - v;
              const moAdd = q.dir === 'mo' ? v : 6 - v;
              ling += lingAdd;
              mo += moAdd;
              dim[q.dim] += (moAdd - lingAdd);
            });

            return { ling, mo, dim, max: questions.value.length * 5 };
          });

          const result = computed(() => {
            const diff = scores.value.mo - scores.value.ling;
            if (diff >= 8) {
              return {
                type: '魔丸型',
                cls: 'mowan',
                summary: '你拥有较强的行动驱动与突破倾向，擅长在高压中主动开路。',
                advice: [
                  '为关键决定设置“二次确认点”，减少冲动决策成本。',
                  '在强推进场景增加共情表达，可显著提升团队执行稳定性。',
                  '把突破目标拆成阶段性里程碑，避免系统性过载。'
                ]
              };
            }
            if (diff <= -8) {
              return {
                type: '灵珠型',
                cls: 'lingzhu',
                summary: '你更偏向稳定、共情与规则意识，善于构建可持续合作关系。',
                advice: [
                  '在需要快决策时，尝试采用“70分信息即行动”策略。',
                  '为个人观点设置清晰边界，避免过度自我牺牲。',
                  '将你的秩序能力转化为可复用的协作流程模板。'
                ]
              };
            }
            return {
              type: '灵魔平衡型',
              cls: 'balanced',
              summary: '你具备稳定与突破两种特质，能够根据情境灵活切换风格。',
              advice: [
                '持续记录“何时稳、何时冲”最有效，形成你的决策地图。',
                '在高压场景优先确定目标边界，再选择推进节奏。',
                '你的优势是整合，建议在跨部门协作中发挥桥接价值。'
              ]
            };
          });

          const dimLabel = {
            empathy: '共情-关系维度',
            control: '稳定-自控维度',
            drive: '行动-突破维度',
            identity: '自我-价值维度'
          };

          const submit = () => {
            if (!allDone.value) {
              alert('请先完成所有题目，再生成测试报告。');
              return;
            }
            submitted.value = true;
          };

          const reset = () => {
            questions.value.forEach(q => (q.answer = null));
            submitted.value = false;
          };

          return {
            showAdModal,
            scale,
            questions,
            answeredCount,
            allDone,
            scores,
            result,
            dimLabel,
            submitted,
            submit,
            reset
          };
        },
        template: `
          <div class="wrap">
            <div>
              <section class="panel hero">
                <h1>灵珠 / 魔丸人格测评中心</h1>
                <p>专业中立视角的行为偏好问卷（娱乐+自我反思用途），帮助你识别“稳定协作”与“突破行动”的相对倾向。</p>
                <div class="notice">本报告并非医学或临床诊断，仅用于个人成长参考；结果受状态波动影响，建议隔 1-2 周复测对比。</div>
              </section>

              <section class="panel quiz">
                <h2 class="section-title">问卷（共 {{ questions.length }} 题）</h2>
                <p style="color:#6b7280;margin-top:-6px;">作答进度：{{ answeredCount }} / {{ questions.length }}</p>
                <article class="q" v-for="q in questions" :key="q.id">
                  <p class="q-title">{{ q.id }}. {{ q.text }}</p>
                  <div class="opts">
                    <label class="opt" v-for="s in scale" :key="s.value">
                      <input type="radio" :name="'q'+q.id" :value="s.value" v-model.number="q.answer" />{{ s.text }}
                    </label>
                  </div>
                </article>

                <div class="actions">
                  <button class="primary" @click="submit">生成专业报告</button>
                  <button class="ghost" @click="reset">重置问卷</button>
                </div>

                <section v-if="submitted" class="report">
                  <span class="badge" :class="result.cls">人格倾向：{{ result.type }}</span>
                  <p>{{ result.summary }}</p>

                  <div class="metrics">
                    <div class="metric">
                      <strong>灵珠总分：</strong> {{ scores.ling }} / {{ scores.max }}
                      <div class="bar"><div class="fill" :style="{width:(scores.ling/scores.max*100).toFixed(0)+'%'}"></div></div>
                    </div>
                    <div class="metric">
                      <strong>魔丸总分：</strong> {{ scores.mo }} / {{ scores.max }}
                      <div class="bar"><div class="fill" :style="{width:(scores.mo/scores.max*100).toFixed(0)+'%'}"></div></div>
                    </div>
                  </div>

                  <h3>维度趋势（正值偏魔丸，负值偏灵珠）</h3>
                  <ul>
                    <li v-for="(val,key) in scores.dim" :key="key">{{ dimLabel[key] }}：{{ val > 0 ? '+' : '' }}{{ val }}</li>
                  </ul>

                  <h3>发展建议</h3>
                  <ul>
                    <li v-for="(item,idx) in result.advice" :key="idx">{{ item }}</li>
                  </ul>
                </section>
              </section>
            </div>

            <aside class="sticky">
              <section class="panel side">
                <div class="ad-card">
                  <div class="ad-tag">广告 · 心理成长服务</div>
                  <h3 style="margin:8px 0 6px;">90 天人格优势训练营</h3>
                  <p style="margin:0;font-size:13px;opacity:.95;">根据你的测评维度，定制行动计划与复盘清单。</p>
                  <a class="ad-btn" href="#" aria-label="查看训练营详情">查看详情</a>
                </div>
                <p style="font-size:13px;color:#6b7280;margin:0;">广告位保留：支持替换为课程、咨询、品牌合作等商业内容。</p>
              </section>
            </aside>

            <div v-if="showAdModal" class="modal">
              <div class="modal-card">
                <div style="font-size:12px;color:#6b7280;">开屏广告 · Sponsored</div>
                <h3 style="margin:6px 0 8px;">限时福利：领取《高压决策心理手册》</h3>
                <p style="margin:0 0 12px;color:#4b5563;">完成测评后可获得匹配你人格风格的决策建议模板。</p>
                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button class="primary" @click="showAdModal=false">我知道了</button>
                  <button class="ghost" @click="showAdModal=false">关闭广告</button>
                </div>
              </div>
            </div>
          </div>
        `
      }).mount('#app');
    </script>
  </body>
</html>
